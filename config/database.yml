# PostgreSQL via Supabase (Transaction Pooler)
# Credentials are loaded from .env via dotenv-rails
# Note: Transaction pooler does not support PREPARE statements,
# so prepared_statements is set to false.

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  database: <%= ENV.fetch("DATABASE_NAME", "questlog_development") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  prepared_statements: false

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
